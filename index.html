<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Imperativo-Trainer · BHAK Wels 3AVK</title>
<style>
:root{--navy:#14294b;--navy2:#22407a;--red:#c8102e;--ink:#1a1f2b;--mut:#5d6677;--line:#dfe3ea;--bg:#f5f6f9;--card:#fff;--ok:#1d4f9c;--okbg:#e6eefb;--badbg:#fde9ec;--warn:#b45309;--warnbg:#fdf1e0}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
header{background:var(--navy);color:#fff;padding:14px 16px 0;position:sticky;top:0;z-index:5}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:12px;max-width:860px;margin:0 auto}
.brand b{letter-spacing:.08em;font-size:13px}
.brand span{font-size:13px;opacity:.85}
h1{font-size:22px;margin:2px auto 10px;max-width:860px;font-weight:700}
h1 i{font-style:normal;color:#ff8c9c}
nav{display:flex;gap:2px;overflow-x:auto;max-width:860px;margin:0 auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;background:none;border:0;color:#c9d3e6;font:inherit;font-size:14px;font-weight:600;padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:#fff;border-bottom-color:var(--red)}
main{max-width:860px;margin:0 auto;padding:16px 14px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
h2{font-size:18px;margin:0 0 8px;color:var(--navy)}
h3{font-size:15px;margin:14px 0 6px;color:var(--navy)}
p{margin:6px 0}
.mut{color:var(--mut);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.btn{display:inline-block;background:var(--navy);color:#fff;border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer}
.btn.red{background:var(--red)}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn.small{padding:7px 11px;font-size:14px;font-weight:600}
.btn:disabled{opacity:.4}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;cursor:pointer;background:#fff;user-select:none}
.chip.on{border-color:var(--navy);background:var(--navy);color:#fff}
.bar{height:10px;background:#e7eaf0;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--navy2)}
.bar i.low{background:var(--red)}
.stat{display:grid;grid-template-columns:120px 1fr 86px;gap:10px;align-items:center;font-size:14px;margin:7px 0}
.stat span:last-child{text-align:right;color:var(--mut)}
.big{font-size:30px;font-weight:800;color:var(--navy);line-height:1.1}
.q{font-size:24px;font-weight:700;margin:6px 0 2px;color:var(--navy)}
.q small{display:block;font-size:14px;font-weight:600;color:var(--mut);margin-top:2px}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--red)}
input[type=text]{width:100%;font:inherit;font-size:20px;padding:12px;border:2px solid var(--line);border-radius:10px;outline:none;background:#fff;color:var(--ink)}
input[type=text]:focus{border-color:var(--navy2)}
input.ok{border-color:var(--ok);background:var(--okbg)}
input.bad{border-color:var(--red);background:var(--badbg)}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.keys button{min-width:40px;padding:8px 0;font:inherit;font-size:17px;font-weight:600;border:1.5px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;color:var(--navy)}
.fb{border-radius:10px;padding:12px;margin-top:10px;font-size:15px}
.fb.ok{background:var(--okbg);border-left:5px solid var(--ok)}
.fb.bad{background:var(--badbg);border-left:5px solid var(--red)}
.fb.warn{background:var(--warnbg);border-left:5px solid var(--warn)}
.fb b.sol{font-size:19px}
.prog{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-bottom:6px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
td.inf{font-weight:700;color:var(--navy)}
td.r{color:var(--red);font-weight:700}
.scroll{overflow-x:auto}
td input[type=text]{font-size:16px;padding:8px;min-width:110px}
.rule{border-left:5px solid var(--navy2);background:var(--okbg);padding:10px 12px;border-radius:8px;margin:8px 0;font-size:15px}
.rule.o{border-color:var(--warn);background:var(--warnbg)}
.rule.r{border-color:var(--red);background:var(--badbg)}
.note1{font-size:44px;font-weight:800;color:var(--navy)}
details{margin:6px 0}summary{cursor:pointer;font-weight:700;color:var(--navy)}
@media(max-width:520px){.stat{grid-template-columns:100px 1fr 70px}.q{font-size:21px}}
</style>
</head>
<body>
<header>
  <div class="brand"><b>BHAK WELS · 3AVK</b><span id="cd"></span></div>
  <h1>Imperativo-<i>Trainer</i></h1>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<script>

  { inf: 'preparar', de: 'vorbereiten', cat: 'reg', a: ['prepara', 'prepare', 'preparad', 'preparen'], n: ['no prepares', 'no prepare', 'no preparéis', 'no preparen'] },

  { inf: 'apagar', de: 'ausschalten', cat: 'reg', note: 'Schreibung: g → gu vor e (apague).', a: ['apaga', 'apague', 'apagad', 'apaguen'], n: ['no apagues', 'no apague', 'no apaguéis', 'no apaguen'] },

  { inf: 'escribir', de: 'schreiben', cat: 'reg', a: ['escribe', 'escriba', 'escribid', 'escriban'], n: ['no escribas', 'no escriba', 'no escribáis', 'no escriban'] },

  { inf: 'probar', de: 'probieren', cat: 'stem', sw: 'o → ue', a: ['prueba', 'pruebe', 'probad', 'prueben'], n: ['no pruebes', 'no pruebe', 'no probéis', 'no prueben'] },

  { inf: 'levantarse', de: 'aufstehen', cat: 'refl', a: ['levántate', 'levántese', 'levantaos', 'levántense'], n: ['no te levantes', 'no se levante', 'no os levantéis', 'no se levanten'] },

   '<h3>Form</h3>'+chips('o',[['a','bejaht (Aufg. 141)'],['n','verneint (Aufg. 142)']],['a'])+'<h3>Anzahl</h3>'+chips('n',[['10','10'],['20','20'],['all','alle 35']],['10'])+
   '<p style="margin-top:16px"><button class="btn" id="s">Starten</button></p></div>';
  bindChips('o',0);bindChips('n',0);
  $('s').onclick=function(){start(take(tarzanItems(chipVals('o')[0]),chipVals('n')[0]),{title:'Sätze'});};
};
pages.errores=function(){
  main.innerHTML='<div class="card"><h2>Corrige los errores</h2><p class="mut">In jedem Satz steckt ein typischer Testfehler. Einige davon stammen aus deinen eigenen Mitschriften und Arbeitsblättern (6. und 8. Schulübung, AB3, AB2 2) – die solltest du besonders gut kennen.</p>'+
   '<button class="btn" id="s">Alle '+ERRORS.length+' Fehler jagen</button> <button class="btn ghost" id="s2">Nur 10</button></div>';
  $('s').onclick=function(){start(shuffle(errItems()),{title:'Fehler finden'});};
  $('s2').onclick=function(){start(take(errItems(),10),{title:'Fehler finden'});};
};
pages.traduce=function(){
  main.innerHTML='<div class="card"><h2>Traduce al español</h2><p class="mut">Kurze deutsche Befehle ins Spanische. Die Person steht in Klammern.</p>'+
   '<button class="btn" id="s">10 Sätze</button> <button class="btn ghost" id="s2">Alle '+TRANSLATE.length+'</button></div>';
  $('s').onclick=function(){start(take(transItems(),10),{title:'Übersetzen'});};
  $('s2').onclick=function(){start(shuffle(transItems()),{title:'Übersetzen'});};
};
pages.test=function(){
  var ex=S.exams.slice(-5).reverse().map(function(e){return '<tr><td>'+e.d+'</td><td>'+e.p+' %</td><td>Note '+grade(e.p)+'</td></tr>';}).join('');
  main.innerHTML='<div class="card"><h2>Probetest</h2><p>24 gemischte Aufgaben wie im Test: Formen (regelmäßig, unregelmäßig, Stammwechsel, reflexiv), Verneinung, Sätze, Fehlerkorrektur und Übersetzung.</p>'+
   '<div class="rule o"><b>Testbedingungen:</b> kein Sofort-Feedback, nichts nachschauen, ca. 12–15 Minuten. Akzentfehler zählen als falsch.</div>'+
   '<p><button class="btn red" id="s">Probetest starten</button></p>'+(ex?'<h3>Bisherige Ergebnisse</h3><table>'+ex+'</table>':'')+
   '<p class="mut">Die Note ist ein Übungsschlüssel, nicht der Schlüssel deiner Lehrkraft.</p></div>';
  $('s').onclick=function(){var v=function(c,pol,n,ps){var f={cats:{},persons:ps||allP(),pol:pol}; if(c) f.cats[c]=1; else f.cats=allC(); return take(verbItems(f),n);};
    var items=[].concat(v('reg','a',3),v('irr','a',5),v('stem','a',3),v('refl','a',3),v(null,'n',3),take(tarzanItems('a'),2),take(tarzanItems('n'),1),take(errItems(),2),take(transItems(),2));
    start(shuffle(items),{title:'Probetest',exam:true,back:'test'});};
};
pages.regeln=function(){
  var tbl=function(cat){return '<div class="scroll"><table><tr><th>Infinitivo</th>'+PERSONS.map(function(p){return '<th>'+p+'</th>';}).join('')+'</tr>'+VERBS.filter(function(v){return v.cat===cat;}).map(function(v){
    return '<tr><td class="inf">'+v.inf+(v.sw?' <span class="mut" style="font-weight:400">('+v.sw+')</span>':'')+'</td>'+v.a.map(function(f,i){return '<td'+(cat==='irr'&&i===0?' class="r"':'')+'>'+f+'</td>';}).join('')+'</tr>';}).join('')+'</table></div>';};
  var ntbl=function(infs){return '<div class="scroll"><table><tr><th>Infinitivo</th>'+PERSONS.map(function(p){return '<th>'+p+'</th>';}).join('')+'</tr>'+VERBS.filter(function(v){return infs.indexOf(v.inf)>=0;}).map(function(v){
    return '<tr><td class="inf">'+v.inf+'</td>'+v.n.map(function(f){return '<td>'+f+'</td>';}).join('')+'</tr>';}).join('')+'</table></div>';};
  main.innerHTML='<div class="card"><h2>Regeln zum Nachschauen</h2><p class="mut">Die Kurzfassung des Lernskripts. Tippe auf eine Überschrift.</p>'+
  '<details open><summary>1 · Regelmäßige Verben</summary><div class="rule"><b>tú</b> = él-Form im Präsens: habla, come, vive.<br><b>usted / ustedes</b> = Vokal tauschen: -ar → <b>e / en</b>, -er und -ir → <b>a / an</b>.<br><b>vosotros</b> = Infinitiv, -r weg, <b>-d</b> dran: hablad, comed, vivid.</div><div class="rule o">Schreibung: pagar → pa<b>gu</b>e, apagar → apa<b>gu</b>e, sacar → sa<b>qu</b>e.</div>'+tbl('reg')+'</details>'+
  '<details><summary>2 · Unregelmäßige Verben</summary><div class="rule r"><b>VEN – DI – SAL – HAZ – TEN – VE – PON – SÉ</b><br>Nur die tú-Form ist eine Kurzform zum Auswendiglernen. ir und ver haben beide <b>ve</b>.</div><div class="rule"><b>usted / ustedes</b> ableiten: yo-Form → -o weg → a / an. hago → haga · tengo → tenga · salgo → salga · pongo → ponga · digo → diga · vengo → venga · veo → vea.<br>Wirklich unregelmäßig: ir → vaya / vayan, ser → sea / sean.<br><b>vosotros</b> ist immer regelmäßig: haced, tened, id, salid, poned, decid, venid, ved, sed.</div>'+tbl('irr')+'</details>'+
  '<details><summary>3 · Stammwechsel</summary><div class="rule">Der Stammwechsel aus dem Präsens (e → ie, o → ue, e → i, u → ue) bleibt bei <b>tú, usted, ustedes</b> – aber <b>nie bei vosotros</b>.</div>'+tbl('stem')+'</details>'+
  '<details><summary>4 · Reflexive Verben</summary><div class="rule">Bejaht wird das Pronomen <b>angehängt</b>: te (tú), se (usted), os (vosotros), se (ustedes). Dadurch wird das Wort länger → <b>Akzent</b> auf die Silbe, die vorher betont war: levanta → lev<b>á</b>ntate.<br>vosotros: das -d fällt weg: levantad + os → <b>levantaos</b> (ohne Akzent).</div>'+tbl('refl')+'</details>'+
  '<details><summary>5 · Verneinter Imperativ</summary><div class="rule"><b>no + (Pronomen) + Subjuntivo-Form.</b><br>usted / ustedes: gleiche Form wie bejaht, nur „no“ davor.<br>tú: usted-Form + <b>s</b> (no hables, no comas).<br>vosotros: <b>-éis</b> (-ar) bzw. <b>-áis</b> (-er/-ir).<br>Pronomen stehen <b>vor</b> dem Verb: ¡Levántate! → ¡No te levantes! · ¡Hazlo! → ¡No lo hagas!</div>'+ntbl(['hablar','comer','vivir','ir','ser','tener','hacer','decir','levantarse'])+'</details>'+
  '<details><summary>6 · Die häufigsten Fehler</summary><div class="scroll"><table><tr><th>Falsch</th><th>Richtig</th><th>Warum</th></tr>'+ERRORS.map(function(e){return '<tr><td><s>'+esc(e[1])+'</s></td><td class="r">'+esc(e[2][0])+'</td><td>'+esc(e[3])+'</td></tr>';}).join('')+'</table></div></details></div>';
};
function go(t){tab=t; R=null; $('nav').innerHTML=TABS.map(function(x){return '<button data-t="'+x[0]+'" class="'+(x[0]===t?'on':'')+'">'+x[1]+'</button>';}).join('');
  $('nav').querySelectorAll('button').forEach(function(b){b.onclick=function(){go(b.dataset.t);};}); pages[t](); window.scrollTo(0,0);}
go('home');
})();
